name: CI

on:
  push:
    branches: [ main, '**/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Detect project directory
        run: |
          if [ -f package.json ]; then DIR=.; else DIR=$(find . -maxdepth 3 -type f -name package.json -printf '%h
          ' | head -n1); fi
          echo "PROJECT_DIR=${DIR}" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci --legacy-peer-deps

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run test -- --runInBand

      - name: Upload coverage (optional)
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then echo "coverage available"; fi
